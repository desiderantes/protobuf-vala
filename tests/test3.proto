syntax = "proto3";
package test.vala3;

// We'll only test proto3 stuff that differs with proto2, like zero-valued enums, default scalar zero-value suppression,
// packed array encoding, and unpacked-to-packed decoding fallback.

enum Enum3 {
	ZERO = 0;
	ONE = 1;
	TWO = 2;
	THREE = 3;
}

message Message3 {
	int32 value_int32 = 1;
	uint32 value_uint32 = 2;
	sint32 value_sint32 = 3;
	fixed32 value_fixed32 = 4;
	sfixed32 value_sfixed32 = 5;
	int64 value_int64 = 6;
	uint64 value_uint64 = 7;
	sint64 value_sint64 = 8;
	fixed64 value_fixed64 = 9;
	sfixed64 value_sfixed64 = 10;
	bool value_bool = 11;
	Enum3 value_enum = 12;
	string value_string = 13;
	bytes value_bytes = 14;
	double value_double = 15;
	float value_float = 16;
}

message ScalarMessage3 {
	sint32 int_value = 1;
	string string_value = 2;
}

message RepeatedMessage3 {
	repeated uint32 value = 1;
}

message EnumMessage3 {
	Enum3 enum_value = 1;
	repeated Enum3 enum_value_r = 2;
}

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/field_mask.proto";

message MapMessage3 {
	map<string, int32> string_to_int = 1;
	map<int32, string> int_to_string = 2;
}

message WktMessage3 {
	google.protobuf.Timestamp timestamp = 1;
	google.protobuf.Duration duration = 2;
}

message OptionalMessage3 {
	optional int32 opt_int = 1;
	optional string opt_str = 2;
	optional Enum3 opt_enum = 3;
	optional bool opt_bool = 4;
}

message WrapperMessage3 {
	google.protobuf.Int32Value wrp_int32 = 1;
	google.protobuf.Int64Value wrp_int64 = 2;
	google.protobuf.UInt32Value wrp_uint32 = 3;
	google.protobuf.UInt64Value wrp_uint64 = 4;
	google.protobuf.FloatValue wrp_float = 5;
	google.protobuf.DoubleValue wrp_double = 6;
	google.protobuf.BoolValue wrp_bool = 7;
	google.protobuf.StringValue wrp_string = 8;
	google.protobuf.BytesValue wrp_bytes = 9;
}

message FieldMaskMessage3 {
	google.protobuf.FieldMask update_mask = 1;
}
